default:
  target: catalog_demo
  outputs:
    catalog_demo:
      type: duckdb
      path: "jaffle_shop.duckdb"
      schema: main
      settings:
        allow_unsigned_extensions: true
      extensions:
        - httpfs
        - iceberg
      secrets:
        - type: s3
          name: minio_secret
          key_id: minio-root-user
          secret: minio-root-password
          endpoint: "localhost:9000"
          url_style: path
          use_ssl: false
        - type: iceberg
          name: polaris_oauth
          client_id: "{{ env_var('POLARIS_CLIENT_ID', '') or env_var('POLARIS_ID', '') }}"
          client_secret: "{{ env_var('POLARIS_CLIENT_SECRET', '') or env_var('POLARIS_SECRET', '') }}"
          oauth2_server_uri: "{{ env_var('POLARIS_OAUTH2_SERVER_URI', '') or ((env_var('POLARIS_URI', '') or env_var('POLARIS_URL', 'https://example.polaris.catalog')) ~ '/v1/oauth/tokens') }}"
        - type: iceberg
          name: horizon_oauth
          client_id: "{{ env_var('HORIZON_CLIENT_ID', 'snowflake') }}"
          client_secret: "{{ env_var('HORIZON_PAT', '') }}"
          oauth2_server_uri: "{{ env_var('HORIZON_OAUTH2_SERVER_URI', '') or (env_var('HORIZON_ENDPOINT', 'https://example.snowflakecomputing.com/polaris/api/catalog') ~ '/v1/oauth/tokens') }}"
          oauth2_scope: "{{ env_var('HORIZON_OAUTH2_SCOPE', 'session:role:ACCOUNTADMIN') }}"
          oauth2_grant_type: "client_credentials"
        - type: iceberg
          name: databricks_pat
          token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
