default:
  target: ducklake_no_path
  outputs:
    # ClickHouse target for static analysis testing (no live connection needed)
    clickhouse_local:
      type: clickhouse
      host: localhost
      port: 8123
      user: default
      password: ""
      schema: jaffle_shop
      database: jaffle_shop
    # Test 1: attach-only with ducklake: scheme, no top-level path (panic fix test)
    ducklake_no_path:
      type: duckdb
      schema: main
      attach:
        - path: "ducklake:jaffle_ducklake_v1.ducklake"
          alias: jaffle_ducklake

    # Test 2: attach-only with is_ducklake: true flag, no top-level path
    ducklake_md_no_path:
      type: duckdb
      schema: main
      attach:
        - path: "md:jaffle_ducklake_remote_demo"
          alias: jaffle_ducklake_remote_demo
          is_ducklake: true
      extensions:
        - httpfs

    # Iceberg REST catalog via Lakekeeper (local docker-compose)
    iceberg_rest:
      type: duckdb
      path: "demo.duckdb"
      database: demo
      schema: default
      settings:
        allow_unsigned_extensions: true
      extensions:
        - httpfs
        - iceberg
      secrets:
        - type: s3
          name: minio_secret
          key_id: minio-root-user
          secret: minio-root-password
          endpoint: "localhost:9000"
          url_style: path
          use_ssl: false

    # Polaris Iceberg REST catalog. Keep credentials in environment variables.
    # Use catalogs.polaris.example.yml as catalogs.yml when testing this target.
    polaris_iceberg_rest:
      type: duckdb
      path: "polaris.duckdb"
      database: demo
      schema: default
      settings:
        allow_unsigned_extensions: true
      extensions:
        - httpfs
        - iceberg
      secrets:
        - type: iceberg
          name: polaris_oauth
          client_id: "{{ env_var('POLARIS_CLIENT_ID', '') or env_var('POLARIS_ID') }}"
          client_secret: "{{ env_var('POLARIS_CLIENT_SECRET', '') or env_var('POLARIS_SECRET') }}"
          oauth2_server_uri: "{{ env_var('POLARIS_OAUTH2_SERVER_URI', '') or ((env_var('POLARIS_URI', '') or env_var('POLARIS_URL')) ~ '/v1/oauth/tokens') }}"

    # Conference demo target: read Polaris sources, write Lakekeeper tables,
    # and attach Horizon for read probes / write-limit repros.
    conference_catalog_demo:
      type: duckdb
      path: "conference_catalog_demo.duckdb"
      schema: main
      settings:
        allow_unsigned_extensions: true
      extensions:
        - httpfs
        - iceberg
      secrets:
        - type: s3
          name: minio_secret
          key_id: minio-root-user
          secret: minio-root-password
          endpoint: "localhost:9000"
          url_style: path
          use_ssl: false
        - type: iceberg
          name: polaris_oauth
          client_id: "{{ env_var('POLARIS_CLIENT_ID', '') or env_var('POLARIS_ID') }}"
          client_secret: "{{ env_var('POLARIS_CLIENT_SECRET', '') or env_var('POLARIS_SECRET') }}"
          oauth2_server_uri: "{{ env_var('POLARIS_OAUTH2_SERVER_URI', '') or ((env_var('POLARIS_URI', '') or env_var('POLARIS_URL')) ~ '/v1/oauth/tokens') }}"

    # Optional Horizon target. Use with catalogs.conference.horizon.example.yml
    # and real HORIZON_* environment variables. HORIZON_PAT may be either a
    # retained Snowflake PAT or a short-lived key-pair JWT generated by
    # scripts/horizon_keypair_env.py.
    conference_catalog_demo_horizon:
      type: duckdb
      path: "conference_catalog_demo.duckdb"
      schema: main
      settings:
        allow_unsigned_extensions: true
      extensions:
        - httpfs
        - iceberg
      secrets:
        - type: s3
          name: minio_secret
          key_id: minio-root-user
          secret: minio-root-password
          endpoint: "localhost:9000"
          url_style: path
          use_ssl: false
        - type: iceberg
          name: polaris_oauth
          client_id: "{{ env_var('POLARIS_CLIENT_ID', '') or env_var('POLARIS_ID') }}"
          client_secret: "{{ env_var('POLARIS_CLIENT_SECRET', '') or env_var('POLARIS_SECRET') }}"
          oauth2_server_uri: "{{ env_var('POLARIS_OAUTH2_SERVER_URI', '') or ((env_var('POLARIS_URI', '') or env_var('POLARIS_URL')) ~ '/v1/oauth/tokens') }}"
        - type: iceberg
          name: horizon_oauth
          client_id: ""
          client_secret: "{{ env_var('HORIZON_PAT') }}"
          oauth2_server_uri: "{{ env_var('HORIZON_OAUTH2_SERVER_URI') }}"
          oauth2_scope: "{{ env_var('HORIZON_OAUTH2_SCOPE') }}"
          oauth2_grant_type: "client_credentials"

    # Original local DuckDB for baseline
    local:
      type: duckdb
      path: "thing.duckdb"

    # Multi-catalog demo target: built-in DuckDB + local filesystem.
    # Copy catalogs.lakekeeper.example.yml to catalogs.yml when testing Iceberg REST.
    catalog_showcase:
      type: duckdb
      path: "catalog_showcase.duckdb"
      schema: main
      extensions:
        - httpfs
      secrets:
        - type: s3
          name: minio_secret
          key_id: minio-root-user
          secret: minio-root-password
          endpoint: "localhost:9000"
          url_style: path
          use_ssl: false
