default:
  target: catalog_showcase
  outputs:
    # Attach-profile demo target: built-in DuckDB + local DuckLake + MotherDuck DuckLake
    catalog_showcase:
      type: duckdb
      path: "catalog_showcase.duckdb"
      schema: main
      attach:
        - path: "ducklake:jaffle_ducklake.ducklake"
          alias: jaffle_ducklake
        - path: "md:jaffle_ducklake_remote_demo?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
          alias: jaffle_ducklake_remote_demo
          is_ducklake: true
      extensions:
        - httpfs
        - motherduck
