name: 'jaffle_shop'

config-version: 2
version: '0.1'

profile: 'default'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_modules"
  - "logs"

models:
  jaffle_shop:
    +materialized: table
    +catalog: builtin
    staging:
      +materialized: table
      +catalog: builtin
    orders:
      +catalog: builtin
    customers:
      +catalog: builtin
flags:
  # Required for top-level source catalog routing from models/sources.yml.
  require_generic_test_arguments_property: true
  use_catalogs_v2: true
