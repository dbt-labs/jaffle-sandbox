name: 'jaffle_shop'

config-version: 2
version: '0.1'

profile: 'default'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_modules"
  - "logs"

models:
  +static_analysis: off
  jaffle_shop:
    +materialized: table
    orders:
      +database: jaffle_ducklake
      +tags: [catalog_demo]
    customers:
      +database: jaffle_ducklake_remote_demo
      +tags: [catalog_demo]
    staging:
      +materialized: table
flags:
  require_generic_test_arguments_property: true
