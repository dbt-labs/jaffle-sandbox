catalogs:
  - name: jaffle_ducklake
    type: ducklake
    table_format: default
    config:
      duckdb:
        metadata_path: "jaffle_ducklake.ducklake"
        attach_as: "jaffle_ducklake"
        create_if_not_exists: true

  - name: jaffle_ducklake_remote_demo
    type: ducklake
    table_format: default
    config:
      duckdb:
        metadata_path: "md:jaffle_ducklake_remote_demo"
        data_path: "ducklake_remote_data/"
        create_if_not_exists: true

  - name: iceberg_demo
    type: iceberg_rest
    table_format: iceberg
    config:
      duckdb:
        endpoint: "http://localhost:8181/catalog"
        warehouse: "demo"
        authorization_type: "NONE"
        access_delegation_mode: "NONE"
        attach_as: "iceberg_demo"

  - name: local_files
    type: local_filesystem
    table_format: default
    config:
      duckdb:
        root_path: "local_files"
        file_format: parquet
