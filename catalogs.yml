catalogs:
  - name: lakekeeper
    type: iceberg_rest
    table_format: iceberg
    config:
      duckdb:
        endpoint: "http://localhost:8181/catalog"
        warehouse: "demo"
        authorization_type: "NONE"
        access_delegation_mode: "NONE"
        attach_as: "lakekeeper"
        default_schema: "default"

  - name: polaris
    type: iceberg_rest
    table_format: iceberg
    config:
      duckdb:
        endpoint: "https://example.polaris.catalog"
        warehouse: "demo"
        secret: polaris_oauth
        authorization_type: "OAUTH2"
        access_delegation_mode: "VENDED_CREDENTIALS"
        default_region: "us-west-2"
        attach_as: "polaris"
        default_schema: "sql_server_covid19"

  - name: horizon
    type: horizon
    table_format: iceberg
    config:
      duckdb:
        endpoint: "https://example.snowflakecomputing.com/polaris/api/catalog"
        warehouse: "DEVELOPMENT"
        secret: horizon_oauth
        authorization_type: "OAUTH2"
        access_delegation_mode: "VENDED_CREDENTIALS"
        default_region: "us-west-2"
        attach_as: "horizon"
        default_schema: "ICEBERGRESTPARTITIONBY"

  - name: unity
    type: unity
    table_format: iceberg
    config:
      duckdb:
        endpoint: "https://example.cloud.databricks.com/api/2.1/unity-catalog/iceberg-rest"
        warehouse: "uc_managed_accepts_external_writes"
        secret: databricks_pat
        authorization_type: "OAUTH2"
        access_delegation_mode: "VENDED_CREDENTIALS"
        default_region: "us-west-2"
        attach_as: "unity"
        default_schema: "foo"

  - name: ducklake
    type: ducklake
    table_format: default
    config:
      duckdb:
        metadata_path: "jaffle_ducklake_v1.ducklake"
        attach_as: "ducklake"

  - name: local_files
    type: local_filesystem
    table_format: default
    config:
      duckdb:
        root_path: "local_files"
        file_format: csv
