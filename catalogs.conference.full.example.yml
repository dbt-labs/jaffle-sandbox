catalogs:
  - name: polaris_demo
    type: iceberg_rest
    table_format: iceberg
    config:
      duckdb:
        endpoint: "{{ env_var('POLARIS_URI', '') or env_var('POLARIS_URL') }}"
        warehouse: "{{ env_var('POLARIS_WAREHOUSE') }}"
        secret: polaris_oauth
        authorization_type: "OAUTH2"
        access_delegation_mode: "VENDED_CREDENTIALS"
        default_region: "us-west-2"
        attach_as: "polaris_demo"
        default_schema: "sql_server_covid19"

  - name: iceberg_demo
    type: iceberg_rest
    table_format: iceberg
    config:
      duckdb:
        endpoint: "http://localhost:8181/catalog"
        warehouse: "demo"
        authorization_type: "NONE"
        access_delegation_mode: "NONE"
        attach_as: "iceberg_demo"
        default_schema: "default"

  - name: horizon_demo
    type: horizon
    table_format: iceberg
    config:
      duckdb:
        endpoint: "{{ env_var('HORIZON_ENDPOINT') }}"
        warehouse: "{{ env_var('HORIZON_WAREHOUSE') }}"
        secret: horizon_oauth
        authorization_type: "OAUTH2"
        access_delegation_mode: "VENDED_CREDENTIALS"
        default_region: "{{ env_var('HORIZON_REGION', 'us-west-2') }}"
        attach_as: "horizon_demo"
        default_schema: "{{ env_var('HORIZON_DEFAULT_SCHEMA', 'DEMO') }}"

  - name: unity_demo
    type: unity
    table_format: iceberg
    config:
      duckdb:
        endpoint: "{{ env_var('DATABRICKS_UC_ENDPOINT') }}"
        warehouse: "{{ env_var('DATABRICKS_UC_CATALOG') }}"
        secret: databricks_pat
        authorization_type: "OAUTH2"
        access_delegation_mode: "VENDED_CREDENTIALS"
        attach_as: "unity_demo"
        default_schema: "{{ env_var('DATABRICKS_UC_SCHEMA', 'default') }}"

  - name: local_files
    type: local_filesystem
    table_format: default
    config:
      duckdb:
        root_path: "local_files"
        file_format: csv
